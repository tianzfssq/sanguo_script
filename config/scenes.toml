# 场景与界面元素定义（扩展点）
# - 每个 [scene.xxx.elements.yyy] 定义界面上一个可识别按钮/图标
# - template 文件名相对 templates/ 目录
# - 模板命名规范：拼音首字母_中文名.png（如 c_吃.png、z_主界面营地.png）
# - 模板缺失时程序会跳过该元素，不影响运行
# - 新增元素：加一段配置 + 在 templates/ 放模板图即可
# - 新增导航路径：在 [nav.paths] 里配置"场景.元素"序列

# ============ 主界面 ============
# 判定规则：同时找到 领地+营地 图标（右侧固定按钮栏，模板裁剪紧不含背景，
# 不受角色移动后地图背景变化影响；特惠图标因模板带背景已弃用）
# 营地图标有两种外观（z_主界面营地 / z_主界面营地1），命中任一即算营地
[scene.main]
fallback = true                                # 主界面最后判定（兜底场景）
required = ["territory", "camp"]               # 必须全部命中
forbidden = ["camp_menu.arena_entry"]          # 命中任一则不算主界面

[scene.main.elements.territory]
template = "z_主界面领地.png"
confidence = 0.82

[scene.main.elements.camp]
template = "z_主界面营地.png"
alt_templates = ["z_主界面营地1.png"]           # 营地图标备选外观，命中任一即算营地
confidence = 0.82

[scene.main.elements.guild]
template = "z_主界面工会.png"
confidence = 0.82

[scene.main.elements.eat]
template = "c_吃.png"
confidence = 0.8

# ============ 营地二级菜单（点营地后弹出的弹窗） ============
[scene.camp_menu]
[scene.camp_menu.elements.arena_entry]
template = "y_营地竞技场.png"
confidence = 0.8

# ============ 竞技场界面 ============
# required: 必须命中竞技场固定按键才算竞技场（退出按钮是各小场景通用按钮，不能作为判定特征）
[scene.arena]
required = ["detect"]
[scene.arena.elements.detect]
# alt：页签选中高亮态（亮黄底，66x24，从失败截图裁剪），原模板为未选中暗底态
template = "j_竞技场检测.png"
alt_templates = ["j_竞技场检测1.png"]
confidence = 0.8
[scene.arena.elements.challenge1]
template = "t_挑战1.png"
confidence = 0.8
click_offset = [0, 10]  # 点击中心下移 10px（实测偏上）
[scene.arena.elements.challenge2]
template = "t_挑战2.png"
confidence = 0.8
click_offset = [0, 10]  # 同 challenge1
[scene.arena.elements.exit_main]
template = "t_退出主界面.png"
confidence = 0.8
# 以下两个元素供自动打群雄竞技使用，不参与 arena 场景判定
[scene.arena.elements.qunxiong_tab]
# 「群雄逐鹿」页签（未选中暗底态）：群雄竞技玩法切换入口，点击后等 2s
template = "j_群雄竞技.png"
confidence = 0.8
[scene.arena.elements.challenge_qx]
# 群雄逐鹿玩法按键为"图标+次数+匹配"（不是"挑战"），模板只截"匹配"文字
template = "t_群雄竞技_匹配.png"
confidence = 0.8
[scene.arena.elements.opponent_challenge]
# "选择对手"弹窗内的"挑战"按键（同屏 3 个，find_all 取全部后点最靠下的）
template = "t_群雄竞技_挑战.png"
confidence = 0.8

# ============ 竞技场结算界面 ============
# 检测到后需点击窗口底部退出结算（自动打竞技场用）
[scene.arena_settle]
[scene.arena_settle.elements.settle_detect]
template = "j_竞技场结算.png"
confidence = 0.8

# ============ 战斗界面 ============
# 战斗指令面板特有按钮（自动/锦囊妙计），其他场景不会出现，用模板判定战斗
[scene.battle]
required = ["auto", "jinang"]
[scene.battle.elements.auto]
template = "z_战斗自动.png"
confidence = 0.8
[scene.battle.elements.jinang]
template = "j_战斗锦囊.png"
confidence = 0.8
# 以下两个元素不参与场景判定（不在 required），供工会 Boss 战斗开启自动用
[scene.battle.elements.auto_off]
# 「自动」未开启态（暗底文字），检测到则点击开启
template = "z_自动未开启.png"
confidence = 0.8
[scene.battle.elements.auto_on]
# 「自动」已开启态（亮底文字），用于跳过无谓检测
template = "z_自动开启.png"
confidence = 0.8

# ============ 工会界面 ============
[scene.guild]
# bargain 模板文件（g_工会砍价.png）暂缺，待截图后放入 templates/ 即生效
[scene.guild.elements.bargain]
template = "g_工会砍价.png"
confidence = 0.8
[scene.guild.elements.boss]
# alt：公会活动横幅"公会BOSS"文字（74x27，从失败截图裁剪，只截文字不带背景），
# 原模板为带背景小碎片，界面改版后仅 0.726 导致进工会判定失败
template = "g_工会boss.png"
alt_templates = ["g_工会boss1.png"]
confidence = 0.8
[scene.guild.elements.challenge1]
# Boss 面板的挑战按钮：主模板复用竞技场挑战（含怪物图标+次数），但工会 Boss 面板按钮为
# 纯"挑战"文字（37x20，从现场截图裁剪），故增加 alt；公会大厅页实测 0.591 无误匹配
template = "t_挑战1.png"
alt_templates = ["g_挑战.png"]
confidence = 0.8

# ============ 钓鱼小游戏界面 ============
# 优先判定（放在所有场景之前）：进入钓鱼小游戏后以此场景为准
[scene.fishing]
required = ["detect"]
[scene.fishing.elements.detect]
template = "d_钓鱼检测.png"
confidence = 0.8
[scene.fishing.elements.fish]
# 用大模板（含"钓鱼"文字）：小模板(17x18)会误匹配返回键(0.917)，大模板在等待上钩界面不会误匹配
# alt：按钮高亮/大字号状态（129x38，从当前截图裁剪），原模板(117x30)较扁
template = "d_钓鱼.png"
alt_templates = ["d_钓鱼1.png"]
confidence = 0.8
[scene.fishing.elements.fish_remaining]
template = "d_钓鱼剩余.png"
confidence = 0.8
[scene.fishing.elements.fish_icon]
# 钓鱼图标：退出结算后用于确认已回到钓鱼小游戏
template = "d_钓鱼图标.png"
confidence = 0.8
[scene.fishing.elements.fish_gain]
# alt：奖励弹窗大字"恭喜获得"（160x34），原模板为小字"获得"
template = "d_钓鱼获得.png"
alt_templates = ["d_钓鱼获得1.png"]
confidence = 0.8

# ============ 领地地图 ============
[scene.territory]
[scene.territory.elements.detect]
template = "l_领地检测.png"
confidence = 0.85
[scene.territory.elements.camp_entrance]
template = "l_领地营地.png"
confidence = 0.8
[scene.territory.elements.pond]
template = "l_领地鱼塘.png"
confidence = 0.8

# ============ 导航路径（进入目标场景需依次点击的元素序列） ============
[nav.paths]
arena = ["main.camp", "camp_menu.arena_entry"]
